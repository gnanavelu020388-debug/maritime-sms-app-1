name: CI and Deploy to GCP Cloud Run

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_OPTIONS: --max_old_space_size=4096
  CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  CLOUD_SQL_CONNECTION_NAME: ${{ secrets.CLOUD_SQL_CONNECTION_NAME }}

jobs:
  ci:
    name: "CI: install, lint, typecheck, build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  deploy:
    name: Deploy to Cloud Run
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          export_default_credentials: true
      - name: Deploy Cloud Run service
        run: |
          gcloud run deploy $CLOUD_RUN_SERVICE \
            --source . \
            --region "$GCP_REGION" \
            --platform managed \
            --allow-unauthenticated \
            --service-account "${{ secrets.GCS_RUNTIME_SERVICE_ACCOUNT }}" \
            --set-env-vars NODE_ENV=production,PORT=8080,JWT_SECRET=${{ secrets.JWT_SECRET }},DB_HOST=${{ secrets.DB_HOST }},DB_PORT=${{ secrets.DB_PORT }},DB_USER=${{ secrets.DB_USER }},DB_PASSWORD=${{ secrets.DB_PASSWORD }},DB_NAME=${{ secrets.DB_NAME }},GCS_BUCKET_NAME=${{ secrets.GCS_BUCKET_NAME }}
          if [ -n "${CLOUD_SQL_CONNECTION_NAME:-}" ]; then
            gcloud run services update $CLOUD_RUN_SERVICE \
              --add-cloudsql-instances "$CLOUD_SQL_CONNECTION_NAME" \
              --region "$GCP_REGION"
          fi
